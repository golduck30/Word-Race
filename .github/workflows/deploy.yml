name: Deploy independent Word-Race
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify local copy of game engine and dictionaries
        run: |
          test -s _todayword_source/game.js || (echo 'Original source is not included. First run Actions -> Import todayword once.' && exit 1)
          test -s _todayword_source/index.html
          for n in 5 6 7 8; do test -s "_todayword_source/dict/${n}.js"; done
      - name: Build Word-Race with original rules
        run: python tools/build.py
      - name: Validate source syntax and required files
        run: |
          node --check dist/game.js
          node --check dist/addons/spark-economy.js
          node --check dist/addons/word-race.js
          node --check dist/addons/pet-upgrade.js
          node --check dist/addons/spark-economy.js
          node --check dist/addons/bootstrap.js
          node --check dist/solo.js
          node tests/spark-economy.test.js
          node tests/pet-upgrade.test.js
          node tests/nickname-save.test.js
          grep -q 'addons/pet-upgrade.js' dist/index.html
          grep -q 'WR_PET_CATALOG' dist/game.js
          test -f dist/addons/pet-upgrade.js
          test -s dist/dict/8.js
          test -s dist/dict/5.js
          test -s dist/assets/nonemo/catalog.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deploy
