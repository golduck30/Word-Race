<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Word-Race | 혼자하기</title>
<script src="https://unpkg.com/hangul-js@0.2.6/hangul.js"></script><link rel="stylesheet" href="addons/word-race.css">
<style>body{font-family:system-ui,-apple-system,sans-serif;color:#403854;margin:0}.solo{max-width:610px;margin:30px auto;padding:14px}.solo-card{padding:24px;background:#fff;border-radius:24px;box-shadow:0 12px 40px #7166a01a}.solo-controls{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.solo-controls select,.solo-controls input{border:1px solid #d8d1e4;padding:12px;border-radius:12px;flex:1;min-width:90px}.solo-board{display:flex;flex-direction:column;gap:5px;align-items:center;margin:22px 0}.solo-row{display:flex;gap:4px;width:100%;justify-content:center}.solo-tile{display:flex;align-items:center;justify-content:center;border:2px solid #e8e0f1;border-radius:9px;width:min(10vw,48px);height:min(10vw,48px);font-weight:800;color:#4a3d60}.solo-tile.correct{background:#4ac48d;color:white;border-color:#4ac48d}.solo-tile.present{background:#e7bd57;color:white;border-color:#e7bd57}.solo-tile.absent{background:#9ca6b9;color:white;border-color:#9ca6b9}.solo-help{font-size:13px;color:#857b98;line-height:1.7}.solo-title{font-size:24px;font-weight:900;color:#5d4685}
/* Play board and on-screen keyboard aligned to multiplayer mode. */
.solo-global-header{width:100%;background:#fff;border-bottom:1px solid #e2e8f0;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;box-sizing:border-box;flex-wrap:wrap}
.solo-brand{display:flex;gap:9px;align-items:center;color:#253448}.solo-brand strong{font-size:20px}.solo-logo{font-size:18px;color:white;background:#10b981;padding:4px 9px;border-radius:6px;font-weight:900}.solo-badge{font-size:11px;border-radius:99px;background:#f1f5f9;color:#475569;padding:4px 8px}
.solo{margin:14px auto!important;max-width:560px!important}.solo-card{box-shadow:0 8px 32px #7166a016}.solo-board{margin:18px 0 15px!important}.solo-row{gap:5px!important}.solo-tile{width:min(10vw,48px);height:min(10vw,48px);background:#fff}.solo-tile.current{border-color:#10b981;background:#dcfce7}
.solo-keyboard{max-width:410px;margin:0 auto 16px;display:flex;flex-direction:column;gap:5px;align-items:stretch;user-select:none}
.solo-key-row{display:flex;gap:4px;justify-content:center;width:100%}
.solo-key{flex:1;min-width:0;border:none;border-radius:6px;background:#e2e8f0;color:#334155;min-height:42px;font-size:15px;font-weight:800;cursor:pointer;touch-action:manipulation}
.solo-key:active{transform:scale(.96);background:#cbd5e1}.solo-key.solo-enter{background:#059669;color:white;flex:1.65;font-size:13px}.solo-key.solo-delete{background:#cbd5e1;flex:1.25}
.solo-key.correct{background:#4ade80;color:#fff}.solo-key.present{background:#facc15;color:#fff}.solo-key.absent{background:#94a3b8;color:#fff}
.solo-controls button{min-height:42px}.solo-controls input{font-size:16px}
@media(max-width:480px){.solo-card{padding:14px}.solo-brand strong{font-size:17px}.solo-key{min-height:39px;font-size:13px}.solo-tile{width:min(10.2vw,42px);height:min(10.2vw,42px)}.solo-global-header{padding:9px}}
</style>
<script src="dictionary.js"></script></head><body><header class="solo-global-header"><div class="solo-brand"><span class="solo-logo">단</span><strong>오늘의 단어</strong><span class="solo-badge">혼자 하기</span></div><div class="solo-header-actions"><a href="index.html" class="wr-btn">🏁 대결 방</a></div></header><main class="solo"><div class="solo-card"><div class="solo-title">🌷 Word-Race · 혼자하기</div><p class="solo-help">원본 todayword 단어 사전 · 5번 도전 · 힌트 없음 · 코인 지급 없음</p><div class="solo-controls"><select id="soloLength"><option value="5">5자모</option><option value="6">6자모</option><option value="7">7자모</option><option value="8">8자모</option></select><select id="soloTime"><option value="attack">타임어택</option><option value="free">무제한</option></select><button id="soloNext" class="wr-btn primary">새 문제</button></div><div id="soloTimer" class="solo-help"></div><div class="solo-board" id="soloBoard"></div><div class="solo-keyboard" id="soloKeyboard" aria-label="한글 화면 키보드"></div><form id="soloForm" class="solo-controls"><input id="soloInput" type="text" placeholder="키보드로 입력하거나 아래 버튼을 누르세요" maxlength="12" autocomplete="off" aria-label="추측할 단어"><button class="wr-btn primary">제출</button></form><p id="soloMessage" aria-live="polite" class="solo-help"></p><a class="wr-btn" href="index.html">🏁 대결 화면으로 돌아가기</a></div></main><script src="solo.js"></script></body></html>
