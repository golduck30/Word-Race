<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Word-Race | 혼자하기</title>
<script src="https://unpkg.com/hangul-js@0.2.6/hangul.js"></script><link rel="stylesheet" href="addons/word-race.css">
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
*{box-sizing:border-box}
body{margin:0;background:#f8fafc!important;font-family:Pretendard,system-ui,sans-serif;color:#1e293b}
.solo-global-header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:white;border-bottom:1px solid #e2e8f0;padding:12px 18px}
.solo-brand{display:flex;align-items:center;gap:9px}.solo-brand strong{font-size:20px;font-weight:800}
.solo-logo{background:#10b981;color:white;padding:5px 8px;border-radius:7px;font-weight:900}.solo-badge{background:#f1f5f9;color:#475569;border-radius:20px;padding:4px 8px;font-size:11px}
.solo{max-width:448px;margin:12px auto;padding:0 12px}.solo-card{background:white;border-radius:14px;padding:16px;box-shadow:0 8px 24px #0000000b}
.solo-title{font-size:17px;font-weight:850;color:#334155}.solo-help{color:#64748b;font-size:12px;line-height:1.6;margin:8px 0}.solo-score{color:#059669;font-weight:700;font-size:12px;margin:8px 0}
.solo-controls{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin:10px 0}.solo-controls select{flex:1;min-width:85px;border:1px solid #cbd5e1;border-radius:9px;padding:9px;background:white;color:#334155}
.solo-board{width:100%;display:grid;gap:8px;margin:20px auto 14px}
.solo-row{display:grid;grid-template-columns:repeat(var(--solo-length,5),minmax(0,1fr));gap:8px;width:100%}
.solo-tile{display:flex;align-items:center;justify-content:center;width:100%;aspect-ratio:1/1;font-size:1.25rem;font-weight:700;border:2px solid #e2e8f0;background:white;color:#1e293b;border-radius:.5rem;transition:all .15s ease-in-out}
.solo-tile.current{border-color:#64748b;transform:scale(1.03)}
.solo-tile.correct{background:#4ade80!important;border-color:#4ade80!important;color:white!important}.solo-tile.present{background:#facc15!important;border-color:#facc15!important;color:white!important}.solo-tile.absent{background:#94a3b8!important;border-color:#94a3b8!important;color:white!important}
.solo-keyboard{width:100%;display:flex;flex-direction:column;gap:6px;margin:0 auto 10px;padding-bottom:8px;user-select:none}
.solo-key-row{width:100%;display:flex;justify-content:center;gap:6px}.solo-key-row:nth-child(2){padding:0 8px}
.solo-key{background:#e2e8f0;color:#334155;font-weight:600;border:0;border-radius:.5rem;display:flex;align-items:center;justify-content:center;flex:1;min-width:0;min-height:46px;padding:8px 0;cursor:pointer;font-size:.95rem;box-shadow:0 1px 2px #0000000d}
.solo-key:active{background:#cbd5e1;transform:scale(.95)}
.solo-key.correct{background:#4ade80!important;color:white!important}.solo-key.present{background:#facc15!important;color:white!important}.solo-key.absent{background:#94a3b8!important;color:white!important}
.solo-key.solo-enter{background:#059669;color:white;flex:2}.solo-key.solo-delete{background:#cbd5e1}
.solo-native-input{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.solo-help-text{display:block;width:100%;font-size:11px;color:#94a3b8;text-align:center}
@media(max-width:400px){.solo{padding:0 7px}.solo-card{padding:12px}.solo-row,.solo-board{gap:5px}.solo-key-row{gap:4px}.solo-key{font-size:13px;min-height:42px}.solo-tile{font-size:1rem;border-width:1.5px}.solo-brand strong{font-size:17px}}
@media(prefers-reduced-motion:reduce){.solo-tile,.solo-key{transition:none}}
</style>
<script src="dictionary.js"></script></head><body><header class="solo-global-header"><div class="solo-brand"><span class="solo-logo">단</span><strong>오늘의 단어</strong><span class="solo-badge">혼자 하기</span></div><div class="solo-header-actions"><a href="index.html" class="wr-btn">🏁 대결 방</a></div></header><main class="solo"><div class="solo-card"><div class="solo-title">🌷 Word-Race · 혼자하기</div><div class="solo-score" id="soloScore">연습 점수 0점 · 정답 +20점</div><p class="solo-help">대결 정답 100점 · 혼자하기 정답 20점 · 힌트 없음 · 코인 지급 없음</p><div class="solo-controls"><select id="soloLength"><option value="5">5자모</option><option value="6">6자모</option><option value="7">7자모</option><option value="8">8자모</option></select><select id="soloTime"><option value="attack">타임어택</option><option value="free">무제한</option></select><button id="soloNext" class="wr-btn primary">새 문제</button></div><div id="soloTimer" class="solo-help"></div><div class="solo-board board-5" id="soloBoard"></div><div class="solo-keyboard" id="soloKeyboard" aria-label="한글 화면 키보드"></div><form id="soloForm" class="solo-native-form"><input id="soloInput" class="solo-native-input" type="text" maxlength="12" autocomplete="off" aria-label="키보드 입력"></form><p id="soloMessage" aria-live="polite" class="solo-help"></p><a class="wr-btn" href="index.html">🏁 대결 화면으로 돌아가기</a></div></main><script src="solo.js"></script></body></html>
