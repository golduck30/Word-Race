<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Word-Race | 혼자하기</title>
<script src="https://unpkg.com/hangul-js@0.2.6/hangul.js"></script><link rel="stylesheet" href="addons/word-race.css">
<style>body{font-family:system-ui,-apple-system,sans-serif;color:#403854;margin:0}.solo{max-width:610px;margin:30px auto;padding:14px}.solo-card{padding:24px;background:#fff;border-radius:24px;box-shadow:0 12px 40px #7166a01a}.solo-controls{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.solo-controls select,.solo-controls input{border:1px solid #d8d1e4;padding:12px;border-radius:12px;flex:1;min-width:90px}.solo-board{display:flex;flex-direction:column;gap:5px;align-items:center;margin:22px 0}.solo-row{display:flex;gap:4px;width:100%;justify-content:center}.solo-tile{display:flex;align-items:center;justify-content:center;border:2px solid #e8e0f1;border-radius:9px;width:min(10vw,48px);height:min(10vw,48px);font-weight:800;color:#4a3d60}.solo-tile.correct{background:#4ac48d;color:white;border-color:#4ac48d}.solo-tile.present{background:#e7bd57;color:white;border-color:#e7bd57}.solo-tile.absent{background:#9ca6b9;color:white;border-color:#9ca6b9}.solo-help{font-size:13px;color:#857b98;line-height:1.7}.solo-title{font-size:24px;font-weight:900;color:#5d4685}</style>
<script src="dictionary.js"></script></head><body><main class="solo"><div class="solo-card"><div class="solo-title">🌷 Word-Race · 혼자하기</div><p class="solo-help">원본 todayword 단어 사전 · 5번 도전 · 힌트 없음 · 코인 지급 없음</p><div class="solo-controls"><select id="soloLength"><option value="5">5자모</option><option value="6">6자모</option><option value="7">7자모</option><option value="8">8자모</option></select><select id="soloTime"><option value="attack">타임어택</option><option value="free">무제한</option></select><button id="soloNext" class="wr-btn primary">새 문제</button></div><div id="soloTimer" class="solo-help"></div><div class="solo-board" id="soloBoard"></div><form id="soloForm" class="solo-controls"><input id="soloInput" type="text" placeholder="한글 단어 입력" maxlength="12" autocomplete="off" aria-label="추측할 단어"><button class="wr-btn primary">제출</button></form><p id="soloMessage" aria-live="polite" class="solo-help"></p><a class="wr-btn" href="index.html">🏁 대결 화면으로 돌아가기</a></div></main><script src="solo.js"></script></body></html>
